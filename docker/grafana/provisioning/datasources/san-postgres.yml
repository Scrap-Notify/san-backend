apiVersion: 1

datasources:
  - name: SAN PostgreSQL
    uid: san-postgres
    type: postgres
    access: proxy
    url: db:5432
    database: san
    user: san
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true
